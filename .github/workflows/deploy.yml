# Every push to main: build the site and upload it to Hostinger over FTP.
# Needs repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. ftp.wonads.com or the IP shown in hPanel → Files → FTP Accounts
#   FTP_USERNAME   e.g. u123456789 (from the same hPanel page)
#   FTP_PASSWORD   the FTP account password
# Optional:
#   FTP_SERVER_DIR folder to upload into (default: public_html/)
name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allows "Run workflow" by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npx astro build

      - name: Add Hostinger rules (.htaccess)
        run: cp hostinger/.htaccess dist/.htaccess

      - name: Upload to Hostinger
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          # Only changed files are uploaded. Files on the server that this site never
          # uploaded (e.g. Hostinger's own files) are left alone.

      - name: FTP not configured yet
        if: env.FTP_SERVER == ''
        run: echo "::warning::Build OK, but no upload - add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to deploy."
