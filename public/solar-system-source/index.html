    <script>
      const services = window.SOLAR_SERVICES;

      const openService = (slug) => {
        const destination = new URL('services.html', window.parent.location.href);
        destination.hash = slug;
        window.parent.location.href = destination.href;
      };

      const openHome = () => {
        const destination = new URL('index.html', window.parent.location.href);
        destination.hash = '';
        window.parent.location.href = destination.href;
      };

      let anchorFrame = 0;
      const anchorSolarToPalm = () => {
        const founder = document.querySelector('.solar-founder');
        const solar = document.querySelector('.hero-space-canvas');
        const sun = document.querySelector('.sun-label');
        if (!founder || !founder.complete) return;

        const founderBox = founder.getBoundingClientRect();
        if (!founderBox.width) return;

        const targetX = founderBox.left + founderBox.width * .455;
        const targetY = founderBox.top + founderBox.height * .72 - 38;
        const fallback = document.querySelector('.solar-fallback-system');
        if (fallback) {
          fallback.style.left = `${targetX}px`;
          fallback.style.top = `${targetY}px`;
        }
        if (!solar || !sun) return;
        const sunBox = sun.getBoundingClientRect();
        if (!sunBox.width) return;
        const sunX = sunBox.left + sunBox.width / 2;
        const sunY = sunBox.top + sunBox.height / 2;
        const probe = document.createElement('div');
        probe.className = 'hero-space-canvas solar-anchor-probe';
        probe.style.setProperty('--solar-anchor-x', '0px');
        probe.style.setProperty('--solar-anchor-y', '0px');
        document.body.appendChild(probe);
        const liveMatrix = new DOMMatrixReadOnly(getComputedStyle(solar).transform);
        const baseMatrix = new DOMMatrixReadOnly(getComputedStyle(probe).transform);
        const currentX = liveMatrix.m41 - baseMatrix.m41;
        const currentY = liveMatrix.m42 - baseMatrix.m42;
        probe.remove();
        const nextX = currentX + targetX - sunX;
        const nextY = currentY + targetY - sunY;

        solar.dataset.anchorX = String(nextX);
        solar.dataset.anchorY = String(nextY);
        solar.style.setProperty('--solar-anchor-x', `${nextX}px`);
        solar.style.setProperty('--solar-anchor-y', `${nextY}px`);
      };

      const schedulePalmAnchor = () => {
        cancelAnimationFrame(anchorFrame);
        anchorFrame = requestAnimationFrame(() => requestAnimationFrame(anchorSolarToPalm));
      };

      const bindServiceLabels = () => {
        const labels = [...document.querySelectorAll('.planet-label')];
        const canvas = document.querySelector('canvas');
        if (canvas && !canvas.dataset.contextWatch) {
          canvas.dataset.contextWatch = 'true';
          canvas.addEventListener('webglcontextlost', (event) => {
            event.preventDefault();
            document.body.classList.remove('webgl-ready');
          });
          canvas.addEventListener('webglcontextrestored', () => document.body.classList.add('webgl-ready'));
        }
        if (canvas && labels.length >= 10) document.body.classList.add('webgl-ready');
        labels.forEach((label, index) => {
          const service = services[index];
          if (!service || label.dataset.serviceBound) return;
          label.dataset.serviceBound = 'true';
          label.dataset.serviceName = `${service.icon} ${service.name}`;
          label.setAttribute('role', 'link');
          label.setAttribute('tabindex', '0');
          label.setAttribute('aria-label', `Open ${service.name}`);
          label.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
          }, true);
          label.addEventListener('pointerup', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            openService(service.slug);
          }, true);
          label.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            openService(service.slug);
          }, true);
          label.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') openService(service.slug);
          });
        });

        const centre = document.querySelector('.sun-label');
        if (centre && !centre.dataset.serviceBound) {
          centre.dataset.serviceBound = 'true';
          centre.classList.add('clickable');
          centre.dataset.serviceName = 'Won Ads';
          centre.setAttribute('role', 'link');
          centre.setAttribute('tabindex', '0');
          centre.setAttribute('aria-label', 'Open Won Ads home page');
          centre.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
          }, true);
          centre.addEventListener('pointerup', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            openHome();
          }, true);
          centre.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            openHome();
          }, true);
          centre.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') openHome();
          });
        }
        schedulePalmAnchor();
      };

      const labelObserver = new MutationObserver(bindServiceLabels);
      labelObserver.observe(document.getElementById('root'), { childList: true, subtree: true });
      const founderImage = document.querySelector('.solar-founder');
      founderImage.addEventListener('load', schedulePalmAnchor, { once: true });
      window.addEventListener('resize', schedulePalmAnchor, { passive: true });
      new ResizeObserver(schedulePalmAnchor).observe(founderImage);
      [120, 420, 900, 1600].forEach((delay) => setTimeout(schedulePalmAnchor, delay));
      bindServiceLabels();
    </script>
